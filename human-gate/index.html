<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com; style-src 'self' 'unsafe-inline'; connect-src https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firestore.googleapis.com; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'none'">
<title>Human Gate</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#17181a;--sub:#6f747c;--line:#dfe3e8;--accent:#1f6feb;--good:#16794b;--bad:#b42318;--edit:#8a5a00;--button:#fff;--soft:#eef2f6}
@media(prefers-color-scheme:dark){:root{--bg:#111315;--card:#1a1d20;--text:#f2f3f5;--sub:#a7adb5;--line:#33383e;--button:#202429;--soft:#24292f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;min-height:100vh}button,input{font:inherit}.app{width:min(820px,100%);margin:auto;min-height:100vh;display:flex;flex-direction:column}header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand h1{font-size:18px;margin:0}.headerbtn{border:1px solid var(--line);background:var(--button);color:var(--text);border-radius:11px;padding:9px 11px;font-weight:700;cursor:pointer;touch-action:manipulation}main{padding:18px 16px 104px}.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}.overall{margin-bottom:16px}.bigrow{display:flex;justify-content:space-between;gap:12px;align-items:flex-end}.bigrow strong{font-size:20px}.sub{color:var(--sub);font-size:13px;line-height:1.55}.bar{height:8px;background:var(--line);border-radius:999px;overflow:hidden;margin-top:10px}.bar>div{height:100%;width:0;background:var(--accent);transition:width .2s}.sectiontitle{font-size:17px;margin:0 0 12px}.categorylist,.termlist{display:grid;gap:10px}.catcard,.termcard{width:100%;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:14px;padding:14px;cursor:pointer;touch-action:manipulation}.cathead,.termhead{display:flex;justify-content:space-between;gap:12px;align-items:center}.catname,.termname{font-weight:800;font-size:16px}.status{font-weight:800;font-size:13px;white-space:nowrap}.status.done{color:var(--good)}.status.partial{color:var(--edit)}.status.none{color:var(--sub)}.minibar{height:6px;background:var(--line);border-radius:999px;overflow:hidden;margin-top:9px}.minibar>div{height:100%;background:var(--accent)}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.primary{border:0;background:var(--accent);color:#fff;border-radius:12px;padding:11px 14px;font-weight:800;cursor:pointer;touch-action:manipulation}.secondary{border:1px solid var(--line);background:var(--button);color:var(--text);border-radius:12px;padding:10px 13px;font-weight:700;cursor:pointer;touch-action:manipulation}.breadcrumb{display:flex;gap:7px;align-items:center;color:var(--sub);font-size:13px;margin-bottom:12px;flex-wrap:wrap}.crumbbtn{border:0;background:transparent;color:var(--accent);padding:0;cursor:pointer;font-weight:700}.reviewwrap{display:flex;flex-direction:column;gap:12px}.meta{display:flex;flex-wrap:wrap;gap:8px}.tag{font-size:12px;color:var(--sub);border:1px solid var(--line);border-radius:999px;padding:5px 8px;background:var(--card)}.reviewcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px 20px;min-height:42vh;display:flex;align-items:center;justify-content:center}.sentence{width:100%;white-space:pre-wrap;line-height:1.85;font-size:clamp(22px,4.3vw,32px);font-weight:650;text-align:center;word-break:break-word}.editarea{width:100%;min-height:220px;border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--text);padding:16px;font:inherit;font-size:20px;line-height:1.7;resize:vertical}.reviewstate{min-height:22px;color:var(--sub);font-size:13px;font-weight:700;text-align:center}.actions{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(820px,100%);z-index:4;background:var(--bg);border-top:1px solid var(--line);padding:11px 16px calc(11px + env(safe-area-inset-bottom))}.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}.action{border:1px solid var(--line);border-radius:13px;background:var(--button);color:var(--text);min-height:58px;font-size:16px;font-weight:800;cursor:pointer;touch-action:manipulation}.action.good{color:var(--good)}.action.edit{color:var(--edit)}.action.bad{color:var(--bad)}.navrow{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:9px}.navbtn{border:1px solid var(--line);background:var(--button);color:var(--text);border-radius:11px;min-height:44px;font-weight:700;cursor:pointer;touch-action:manipulation}.editbuttons{display:none;grid-template-columns:1fr 1fr;gap:9px}.notice{background:var(--soft);border-radius:12px;padding:10px 12px;color:var(--sub);font-size:12px;line-height:1.5;margin-top:14px}.loginform{display:grid;gap:12px;margin-top:14px}.loginform label{font-size:13px;font-weight:700}.loginform input{width:100%;margin-top:5px;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:11px;padding:12px}.syncrow{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.syncok{color:var(--good)}.syncerr{color:var(--bad)}
@media(max-width:560px){header,main,.actions{padding-left:12px;padding-right:12px}.reviewcard{min-height:48vh;padding:20px 15px}.catcard,.termcard{padding:13px}}
</style>
</head>
<body>
<div class="app">
<header><div class="top"><div class="brand"><h1 id="headerTitle">Human Gate</h1></div><button class="headerbtn" id="exportBtn">CSV出力</button></div></header>
<main id="main"></main>
<div class="actions" id="actions" hidden>
  <div class="three" id="normalActions">
    <button class="action good" id="heartBtn">♥ 採用</button>
    <button class="action edit" id="editBtn">✎ 修正</button>
    <button class="action bad" id="rejectBtn">× 不採用</button>
  </div>
  <div class="editbuttons" id="editActions">
    <button class="action" id="cancelEditBtn">キャンセル</button>
    <button class="action good" id="saveEditBtn">修正して採用</button>
  </div>
  <div class="navrow">
    <button class="navbtn" id="prevBtn">← 前の文</button>
    <button class="navbtn" id="nextBtn">次の文 →</button>
  </div>
</div>
</div>
<script src="./data/things.js"></script>
<script src="./data/actions.js"></script>
<script src="./data/checks.js"></script>
<script src="./data/status.js"></script>
<script src="./data/safety.js"></script>
<script src="./data/places.js"></script>
<script src="./data/r1-things.js"></script>
<script src="./data/r1-actions.js"></script>
<script src="./data/r1-checks.js"></script>
<script src="./data/r1-status.js"></script>
<script src="./data/r1-safety.js"></script>
<script src="./data/r1-places.js"></script>
<script src="./data/normalize.js"></script>
<script src="./firebase-config.js"></script>
<script src="./sync.js"></script>
<script src="./app.js"></script>
</body>
</html>
