let SOURCE=[];TERMS.forEach((t,ti)=>{const items=['place','status','broken','stop'].includes(t.mode)?special(t):generic(t);items.forEach((r,j)=>{r.candidate_id=`B001-${String(SOURCE.length+1).padStart(4,'0')}`;r.batch_id='HG-B001';r.pilot_order=ti+1;r.term_category=t.cat;r.safety_flag=!!t.safe;SOURCE.push(r)})});
const STORAGE_KEY='human_gate_b001_pages_v1';let state={index:0,reviews:{}};let storageEnabled=true;function load(){try{const raw=localStorage.getItem(STORAGE_KEY);if(raw){const s=JSON.parse(raw);if(s&&typeof s.index==='number'&&s.reviews)state=s}}catch(e){storageEnabled=false}}function save(){try{if(storageEnabled)localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}catch(e){storageEnabled=false}}function count(){return Object.keys(state.reviews).length}function current(){return SOURCE[state.index]}function nextUnreviewed(from=state.index+1){for(let i=from;i<SOURCE.length;i++)if(!state.reviews[SOURCE[i].candidate_id])return i;for(let i=0;i<from;i++)if(!state.reviews[SOURCE[i].candidate_id])return i;return-1}

function esc(v){return'"'+String(v??'').replace(/"/g,'""')+'"'}function exportCSV(){const h=['candidate_id','batch_id','pilot_order','term','term_category','safety_flag','candidate_type','case_label','primary_pattern_id','primary_pattern','text','review_status','review_action','revised_text','reviewed_at'];const lines=[h.map(esc).join(',')];SOURCE.forEach(r=>{const rv=state.reviews[r.candidate_id];const o={...r,review_status:rv?'REVIEWED':'UNREVIEWED',review_action:rv?.action||'',revised_text:rv?.revised_text||'',reviewed_at:rv?.reviewed_at||''};lines.push(h.map(k=>esc(o[k])).join(','))});const blob=new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`human_gate_b001_results_${new Date().toISOString().slice(0,10)}.csv`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
heartBtn.onclick=()=>apply('HEART');rejectBtn.onclick=()=>apply('REJECT');editBtn.onclick=enterEdit;cancelEditBtn.onclick=exitEdit;saveEditBtn.onclick=()=>{const v=editArea.value.trim();if(v)apply('EDIT',v)};prevBtn.onclick=()=>{if(state.index>0){state.index--;save();render()}};jumpBtn.onclick=()=>{const ni=nextUnreviewed(0);if(ni>=0){state.index=ni;save();render()}};exportBtn.onclick=exportCSV;exportDoneBtn.onclick=exportCSV;document.addEventListener('keydown',e=>{if(!editArea.hidden)return;if(e.key==='1')apply('HEART');else if(e.key==='2')enterEdit();else if(e.key==='3')apply('REJECT');else if(e.key==='ArrowLeft'&&state.index>0){state.index--;save();render()}});load();const first=nextUnreviewed(0);if(first>=0)state.index=first;render();
