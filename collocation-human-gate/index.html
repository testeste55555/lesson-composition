<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com; style-src 'self' 'unsafe-inline'; connect-src https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firestore.googleapis.com; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'none'">
  <title>Collocation Human Gate V1.1</title>
  <style>
    :root{--ink:#16213c;--muted:#667085;--line:#d8dfeb;--paper:#fff;--bg:#f3f6fb;--navy:#172a52;--blue:#335eea;--heart:#d92d5a;--edit:#a15c00;--reject:#b42318;--ok:#067647;--warn:#b54708;--danger:#b42318;--shadow:0 8px 28px rgba(31,45,72,.09)}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;line-height:1.55}button,input,textarea{font:inherit}button{cursor:pointer}.shell{max-width:1040px;margin:0 auto;padding:18px 18px 72px}
    header{background:linear-gradient(135deg,#162849,#244b8f);color:#fff;padding:20px;border-radius:18px;box-shadow:var(--shadow);margin-bottom:15px}.headrow{display:flex;justify-content:space-between;gap:18px;align-items:center}.eyebrow{margin:0 0 2px;font-size:12px;letter-spacing:.12em;opacity:.75}.title{font-size:clamp(22px,4vw,34px);font-weight:800;margin:0}.subtitle{font-size:13px;opacity:.78;margin-top:4px}.account{text-align:right;font-size:12px}.account-email{display:block;max-width:280px;overflow:hidden;text-overflow:ellipsis}.headerbtn{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;border-radius:9px;padding:7px 10px;margin-top:6px;font-weight:700}
    .syncbar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin-bottom:14px;font-size:12px}.syncstate{font-weight:800}.syncstate.synced{color:var(--ok)}.syncstate.saving{color:var(--blue)}.syncstate.pending,.syncstate.error{color:var(--warn)}.syncstate.membership{color:var(--danger)}.retry{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 9px;font-weight:700}
    .toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:14px 0}.crumbs{display:flex;gap:7px;align-items:center;min-width:0;flex-wrap:wrap}.crumb{border:0;background:transparent;color:var(--blue);padding:5px 2px}.crumb[disabled]{color:var(--ink);font-weight:700;cursor:default}.sep{color:#98a2b3}.exportbox{position:relative}.exportbtn,.softbtn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:9px 12px;font-weight:700}.exportmenu{display:none;position:absolute;right:0;top:44px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);border-radius:12px;padding:7px;min-width:260px;z-index:9}.exportmenu.open{display:grid}.exportmenu button{border:0;background:transparent;text-align:left;padding:10px;border-radius:8px}.exportmenu button:hover{background:#f2f5fb}
    .summary{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-bottom:16px}.metric{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px}.metric strong{display:block;font-size:22px}.metric span{font-size:11px;color:var(--muted)}h2{font-size:21px;margin:20px 0 12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px;box-shadow:0 2px 8px rgba(31,45,72,.035)}.clickcard{width:100%;text-align:left;color:inherit;transition:.15s}.clickcard:hover{border-color:#9eb5ef;transform:translateY(-1px)}.cardtop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.card h3{margin:0;font-size:17px}.mini{font-size:12px;color:var(--muted)}.bar{height:8px;background:#e7ecf4;border-radius:99px;overflow:hidden;margin:12px 0 7px}.bar>i{display:block;height:100%;background:linear-gradient(90deg,#335eea,#50a6f9);border-radius:99px}.regen{color:var(--warn);font-size:12px;font-weight:700}.conflict-text{color:var(--danger);font-size:12px;font-weight:800}
    .status{font-size:11px;font-weight:800;border-radius:99px;padding:4px 8px;white-space:nowrap}.s-unstarted{background:#eef2f6;color:#475467}.s-progress{background:#eef4ff;color:#3538cd}.s-done{background:#ecfdf3;color:var(--ok)}.s-regen{background:#fff4e8;color:var(--warn)}.s-conflict{background:#fff1f0;color:var(--danger)}
    .termhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:13px}.termword{font-size:28px;font-weight:800}.tag{display:inline-block;font-size:11px;background:#eef2f7;color:#475467;padding:3px 7px;border-radius:99px;margin-right:5px}.jobtag{background:#eef4ff;color:#3538cd}.other-tag{background:#f2f4f7;color:#475467}.conflict-tag{background:#fff1f0;color:var(--danger)}
    .candidate-list{display:grid;gap:10px}.candidate{background:#fff;border:1px solid var(--line);border-radius:15px;padding:15px}.candidate.reviewed{border-color:#b5c3df}.candidate.conflict{border-color:#f97066;background:#fffafa}.candrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center}.candtext{font-size:18px;font-weight:700;overflow-wrap:anywhere}.candmeta{font-size:11px;color:var(--muted);margin-top:5px}.badges{margin-top:7px}.actions{display:flex;gap:7px}.act{width:44px;height:42px;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:19px;font-weight:800}.act:hover{background:#f5f7fb}.act.heart.selected{background:#fff0f4;border-color:#f28cab;color:var(--heart)}.act.edit.selected{background:#fff7e8;border-color:#f4ba63;color:var(--edit)}.act.reject.selected{background:#fff1f0;border-color:#fda29b;color:var(--reject)}.editpanel{display:none;border-top:1px solid var(--line);margin-top:13px;padding-top:13px}.editpanel.open{display:block}.editpanel label{font-size:12px;color:var(--muted);display:block;margin-bottom:6px}.editpanel textarea{width:100%;min-height:76px;border:1px solid #aeb9ca;border-radius:10px;padding:10px;resize:vertical}.editbuttons{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}.primary{border:0;background:var(--blue);color:#fff;border-radius:9px;padding:9px 14px;font-weight:700}.effective{margin-top:8px;font-size:12px;color:var(--edit);font-weight:700}.help{font-size:12px;color:var(--muted);margin:8px 1px 14px}.footer-note{margin-top:26px;font-size:12px;color:var(--muted);text-align:center}
    .login{max-width:500px;margin:50px auto;background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow)}.login h2{margin:0 0 8px}.loginform{display:grid;gap:12px;margin-top:18px}.loginform label{font-size:12px;font-weight:700}.loginform input{width:100%;margin-top:5px;border:1px solid var(--line);border-radius:10px;padding:11px}.notice{background:#fff7ed;color:#9a3412;border-radius:10px;padding:10px 12px;font-size:12px;margin-top:12px}.toast{position:fixed;right:18px;bottom:18px;background:#172a52;color:#fff;border-radius:11px;padding:11px 14px;box-shadow:var(--shadow);opacity:0;transform:translateY(8px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:none}
    @media(max-width:760px){.shell{padding:10px 10px 56px}header{border-radius:14px;padding:16px}.headrow{display:block}.account{text-align:left;margin-top:12px}.summary{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.toolbar{align-items:flex-start}.candrow{grid-template-columns:1fr}.actions{width:100%}.act{flex:1}.candidate,.termhead{padding:13px}.termword{font-size:25px}.exportmenu{position:fixed;left:10px;right:10px;top:auto;bottom:12px}}
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div class="headrow">
        <div><p class="eyebrow">TWO-TEACHER REVIEW</p><h1 class="title">Collocation Human Gate V1.1</h1><div class="subtitle">カテゴリー → 語 → コロケーション</div></div>
        <div class="account" id="account" hidden><span class="account-email" id="accountEmail"></span><button class="headerbtn" id="logoutBtn">ログアウト</button></div>
      </div>
    </header>
    <section class="syncbar" id="syncBar" hidden><span class="syncstate" id="syncState">ログイン待ち</span><button class="retry" id="retryBtn" hidden>再同期</button></section>
    <div class="toolbar" id="toolbar" hidden>
      <nav class="crumbs" id="crumbs" aria-label="現在位置"></nav>
      <div class="exportbox"><button class="exportbtn" id="exportToggle" aria-expanded="false">CSV出力 ▾</button><div class="exportmenu" id="exportMenu"><button data-export="reviews">判定結果（全review）</button><button data-export="accepted">採用コロケーション（確定分）</button><button data-export="regeneration">再生成対象</button><button data-export="conflicts">判定不一致</button></div></div>
    </div>
    <section id="app" aria-live="polite"></section>
    <p class="footer-note" id="footerNote" hidden>判定は端末へ即時保存し、認証済み教員間で同期します。候補データはFirestoreへ保存しません。</p>
  </main>
  <div id="toast" class="toast" role="status"></div>
  <script src="./data/candidates.js"></script>
  <script src="./model.js"></script>
  <script src="./firebase-config.js"></script>
  <script src="./sync.js"></script>
  <script src="./app.js"></script>
</body>
</html>
