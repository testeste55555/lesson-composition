<header><div class="wrap"><h1>授業形態 観点別チェックシート｜PC版</h1><p>学習者の発話・行動から、授業形態と教材媒体を別々に判定します。</p></div></header>
<main>
<nav class="section-nav"><a href="#learner">学習者</a><a href="#goal">目標</a><a href="#manage">運営</a><a href="#condition">条件</a><a href="#current">元授業</a><a href="#issue">改善</a><a href="#result">結果</a><a href="../">入口へ</a></nav>
<section class="card"><h2>使い方</h2><div class="intro"><div><b>①「こうしたい」をチェック</b><p class="note">学習者に何をさせたいか、授業をどう運営したいかを選びます。</p></div><div><b>②「元授業」をチェック</b><p class="note">元授業にある特徴と、改善したい点を選びます。</p></div></div><p class="note">PowerPointかHTMLかを先に決めず、授業形態と媒体を分離して判定します。</p></section>
