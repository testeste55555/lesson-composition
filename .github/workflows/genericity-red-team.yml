name: Genericity RED TEAM

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  genericity-red-team:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned v4
        with:
          persist-credentials: false
      - name: Run genericity regression tests
        run: node tests/genericity-red-team.js
