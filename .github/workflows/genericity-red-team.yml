name: Genericity RED TEAM

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  genericity-red-team:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run genericity regression tests
        run: node tests/genericity-red-team.js
