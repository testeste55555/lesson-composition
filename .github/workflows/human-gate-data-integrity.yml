name: Human Gate Data Integrity

on:
  pull_request:
    paths:
      - 'human-gate/**'
      - 'tests/human-gate-data-integrity.js'
      - '.github/workflows/human-gate-data-integrity.yml'
  push:
    branches: [main]
    paths:
      - 'human-gate/**'
      - 'tests/human-gate-data-integrity.js'
      - '.github/workflows/human-gate-data-integrity.yml'

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned v4
        with:
          persist-credentials: false
      - name: Check candidate corpus
        run: node tests/human-gate-data-integrity.js
