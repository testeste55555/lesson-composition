name: Result Quality RED TEAM

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  result-quality-red-team:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run result quality regression tests
        run: node tests/result-quality-redteam.js
