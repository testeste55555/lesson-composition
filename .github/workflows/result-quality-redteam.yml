name: Result Quality RED TEAM

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  result-quality-red-team:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned v4
        with:
          persist-credentials: false
      - name: Run result quality regression tests
        run: node tests/result-quality-redteam.js
